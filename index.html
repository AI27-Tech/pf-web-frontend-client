<!doctype html>
<!--
      data-theme fija el tema de los tokens de AI27-tech (@ai27-tech/ui). El portal
      de cliente corre en claro por defecto (no hay toggle de tema todavía), así que
      forzamos "light" para que la librería no siga la preferencia del sistema.
      Al añadir un toggle, sincronizar este atributo con la clase .dark del portal.
    -->
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI27 · Portal de cliente</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
